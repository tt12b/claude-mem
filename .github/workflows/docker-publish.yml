name: Build and publish container image

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      tag:
        description: '추가로 붙일 태그 (선택). 비우면 latest + SHA 만 사용'
        required: false
        type: string

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.12'

      # 락파일이 없어 npm ci 는 못 쓴다. build 가 esbuild 를 쓰므로 dev 포함 설치.
      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # Dockerfile 은 plugin/ 만 COPY 하므로, src/ 변경을 반영하려면
      # 이미지 빌드 전에 plugin/ 산출물을 다시 만들어야 한다.
      - name: Build plugin bundle
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=long
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}

      # 실행 대상이 윈도우 PC(amd64) 이므로 arm64 는 만들지 않는다.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/claude-mem/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo '### 이미지 푸시 완료'
            echo
            echo '```'
            echo '${{ steps.meta.outputs.tags }}'
            echo '```'
            echo
            echo '윈도우에서:'
            echo '```'
            echo 'docker compose pull && docker compose up -d'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
